<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="1200" height="370" role="img" aria-labelledby="p2-t">
  <title id="p2-t">Pothik: Next-Generation Ride-Hailing Platform for Bangladesh.</title>
  <defs>
    <linearGradient id="p2-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#190B12"/><stop offset="1" stop-color="#10070C"/>
    </linearGradient>
    <radialGradient id="p2-glow" cx="82%" cy="30%" r="55%">
      <stop offset="0" stop-color="#701A3D" stop-opacity=".7"/><stop offset="1" stop-color="#451126" stop-opacity="0"/>
    </radialGradient>
    <pattern id="p2-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#C77B9B" stroke-opacity=".07"/>
    </pattern>
    <clipPath id="p2-clip"><rect width="1200" height="370" rx="18"/></clipPath>
    <linearGradient id="p2-trace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8F0F3"/><stop offset=".45" stop-color="#E5B5C7"/><stop offset="1" stop-color="#C77B9B" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .p-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .p-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .p-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .p-chip { animation: p-chip .7s cubic-bezier(.34,1.56,.64,1) both; }
    @keyframes p-chip { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .p-draw { stroke-dasharray: 600; stroke-dashoffset: 600; animation: p-draw 2s cubic-bezier(.65,0,.35,1) .5s forwards; }
    @keyframes p-draw { to { stroke-dashoffset: 0; } }
    .p-trace-p2 { stroke-dasharray: 564 3136; stroke-dashoffset: 3700; animation: p-trace 7s linear infinite; }
    @keyframes p-trace { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .p-chip { animation: none; } .p-draw { animation: none; stroke-dashoffset: 0; } .p-trace-p2 { display: none; } }
  </style>
  <g clip-path="url(#p2-clip)">
    <rect width="1200" height="370" fill="url(#p2-bg)"/>
    <rect x="720" width="480" height="370" fill="url(#p2-grid)"/>
    <rect width="1200" height="370" fill="url(#p2-glow)"/>

    <g transform="translate(56 46)">
      <text class="p-mono" x="0" y="16" font-size="12" letter-spacing="2.6" fill="#C77B9B">02 · MOBILITY · TRANSIT · FULL-STACK · 2026</text>
      <text class="p-serif" x="0" y="70" font-size="46" font-weight="300" letter-spacing="-1.2" fill="#F8F0F3">Pothik</text>
      <text class="p-sans" x="0" y="106" font-size="16.5" fill="#B6A3AC">Next-Generation Ride-Hailing Platform for Bangladesh.</text>
      <text class="p-mono" x="0" y="138" font-size="12.5" fill="#E5B5C7"><tspan fill="#C77B9B">BUILT › </tspan>Real-time driver-passenger matching, OpenStreetMap routing with Nominatim, cross-platform Flutter client & React admin console.</text>
      
      <line class="p-draw" x1="0" y1="162" x2="680" y2="162" stroke="#C77B9B" stroke-opacity=".3"/>

      <!-- Metrics -->
      <g transform="translate(0 200)">
        <text class="p-serif" font-size="30" font-weight="300" fill="#F8F0F3">REAL-TIME</text>
        <text class="p-sans" y="24" font-size="12.5" fill="#B6A3AC">WebSocket ride dispatching</text>
      </g>
      <g transform="translate(230 200)">
        <text class="p-serif" font-size="30" font-weight="300" fill="#F8F0F3">OPEN STREET MAP</text>
        <text class="p-sans" y="24" font-size="12.5" fill="#B6A3AC">Zero-dependency custom routing</text>
      </g>
      <g transform="translate(460 200)">
        <text class="p-serif" font-size="30" font-weight="300" fill="#F8F0F3">EMERGENCY SOS</text>
        <text class="p-sans" y="24" font-size="12.5" fill="#B6A3AC">Automated student & rider safety</text>
      </g>
    </g>

    <!-- Chips -->
    <g><g class="p-chip" style="animation-delay:1.00s"><rect x="56" y="314" width="83" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="p-mono" x="97" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">Flutter</text></g><g class="p-chip" style="animation-delay:1.12s"><rect x="147" y="314" width="74" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="p-mono" x="184" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">NestJS</text></g><g class="p-chip" style="animation-delay:1.24s"><rect x="229" y="314" width="92" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="p-mono" x="275" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">React.js</text></g><g class="p-chip" style="animation-delay:1.36s"><rect x="329" y="314" width="110" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="p-mono" x="384" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">PostgreSQL</text></g><g class="p-chip" style="animation-delay:1.48s"><rect x="447" y="314" width="65" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="p-mono" x="479" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">Redis</text></g><g class="p-chip" style="animation-delay:1.60s"><rect x="520" y="314" width="74" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="p-mono" x="557" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">Docker</text></g></g>

    <!-- Right Graphic -->
    <g transform="translate(840 50)">
        <circle cx="120" cy="120" r="110" fill="#1C0915" stroke="#C77B9B" stroke-opacity=".3"/>
        <circle cx="120" cy="120" r="75" fill="none" stroke="#C77B9B" stroke-opacity=".2" stroke-dasharray="3 6"/>
        <circle cx="120" cy="120" r="40" fill="none" stroke="#E11D48" stroke-opacity=".4"/>
        <path d="M40 180 Q 120 80, 200 130" fill="none" stroke="#F8F0F3" stroke-width="2" stroke-dasharray="4 4"/>
        <circle cx="120" cy="120" r="8" fill="#E11D48"/>
        <circle cx="120" cy="120" r="16" fill="none" stroke="#E11D48">
          <animate attributeName="r" values="8;24;8" dur="2.5s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="1;0;1" dur="2.5s" repeatCount="indefinite"/>
        </circle>
        <g transform="translate(40 190)">
          <rect width="160" height="40" rx="8" fill="#14060E" stroke="#C77B9B" stroke-opacity=".3"/>
          <text class="p-mono" x="12" y="24" font-size="10.5" fill="#E5B5C7">DISPATCH: ACTIVE ⚡</text>
        </g>
      </g>

    <rect x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="#C77B9B" stroke-opacity=".2"/>
    <rect class="p-trace-p2" x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="url(#p2-trace)" stroke-width="1.6" stroke-linecap="round"/>
  </g>
</svg>