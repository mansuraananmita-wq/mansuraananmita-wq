<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="1200" height="370" role="img" aria-labelledby="p4-t">
  <title id="p4-t">Scholario &amp; Safely: Campus Scholar Network &amp; Problem Reporting Suite.</title>
  <defs>
    <linearGradient id="p4-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#190B12"/><stop offset="1" stop-color="#10070C"/>
    </linearGradient>
    <radialGradient id="p4-glow" cx="82%" cy="30%" r="55%">
      <stop offset="0" stop-color="#701A3D" stop-opacity=".7"/><stop offset="1" stop-color="#451126" stop-opacity="0"/>
    </radialGradient>
    <pattern id="p4-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#C77B9B" stroke-opacity=".07"/>
    </pattern>
    <clipPath id="p4-clip"><rect width="1200" height="370" rx="18"/></clipPath>
    <linearGradient id="p4-trace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8F0F3"/><stop offset=".45" stop-color="#E5B5C7"/><stop offset="1" stop-color="#C77B9B" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .p-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .p-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .p-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .p-chip { animation: p-chip .7s cubic-bezier(.34,1.56,.64,1) both; }
    @keyframes p-chip { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .p-draw { stroke-dasharray: 600; stroke-dashoffset: 600; animation: p-draw 2s cubic-bezier(.65,0,.35,1) .5s forwards; }
    @keyframes p-draw { to { stroke-dashoffset: 0; } }
    .p-trace-p4 { stroke-dasharray: 564 3136; stroke-dashoffset: 3700; animation: p-trace 7s linear infinite; }
    @keyframes p-trace { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .p-chip { animation: none; } .p-draw { animation: none; stroke-dashoffset: 0; } .p-trace-p4 { display: none; } }
  </style>
  <g clip-path="url(#p4-clip)">
    <rect width="1200" height="370" fill="url(#p4-bg)"/>
    <rect x="720" width="480" height="370" fill="url(#p4-grid)"/>
    <rect width="1200" height="370" fill="url(#p4-glow)"/>

    <g transform="translate(56 46)">
      <text class="p-mono" x="0" y="16" font-size="12" letter-spacing="2.6" fill="#C77B9B">04 · ED-TECH · CAMPUS COLLABORATION · 2026</text>
      <text class="p-serif" x="0" y="70" font-size="46" font-weight="300" letter-spacing="-1.2" fill="#F8F0F3">Scholario &amp; Safely</text>
      <text class="p-sans" x="0" y="106" font-size="16.5" fill="#B6A3AC">Campus Scholar Network &amp; Problem Reporting Suite.</text>
      <text class="p-mono" x="0" y="138" font-size="12.5" fill="#E5B5C7"><tspan fill="#C77B9B">BUILT › </tspan>Scholario provides academic feeds, AI Learning Coach & live Jitsi study rooms; Safely manages campus issue reporting & SOS countdown.</text>
      
      <line class="p-draw" x1="0" y1="162" x2="680" y2="162" stroke="#C77B9B" stroke-opacity=".3"/>

      <!-- Metrics -->
      <g transform="translate(0 200)">
        <text class="p-serif" font-size="30" font-weight="300" fill="#F8F0F3">AI COACH</text>
        <text class="p-sans" y="24" font-size="12.5" fill="#B6A3AC">Personalized study assistant</text>
      </g>
      <g transform="translate(230 200)">
        <text class="p-serif" font-size="30" font-weight="300" fill="#F8F0F3">CAMPUS SAFETY</text>
        <text class="p-sans" y="24" font-size="12.5" fill="#B6A3AC">Confidential issue reporting</text>
      </g>
      <g transform="translate(460 200)">
        <text class="p-serif" font-size="30" font-weight="300" fill="#F8F0F3">COLLABORATION</text>
        <text class="p-sans" y="24" font-size="12.5" fill="#B6A3AC">Real-time peer study groups</text>
      </g>
    </g>

    <!-- Chips -->
    <g><g class="p-chip" style="animation-delay:1.00s"><rect x="56" y="314" width="110" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="p-mono" x="111" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">TypeScript</text></g><g class="p-chip" style="animation-delay:1.12s"><rect x="174" y="314" width="92" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="p-mono" x="220" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">React.js</text></g><g class="p-chip" style="animation-delay:1.24s"><rect x="274" y="314" width="128" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="p-mono" x="338" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">Tailwind CSS</text></g><g class="p-chip" style="animation-delay:1.36s"><rect x="410" y="314" width="110" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="p-mono" x="465" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">Jitsi Meet</text></g><g class="p-chip" style="animation-delay:1.48s"><rect x="528" y="314" width="50" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="p-mono" x="553" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">PWA</text></g></g>

    <!-- Right Graphic -->
    <g transform="translate(840 50)">
        <rect width="250" height="240" rx="14" fill="#190B12" stroke="#C77B9B" stroke-opacity=".3"/>
        <text class="p-mono" x="20" y="35" font-size="11" fill="#E5B5C7">CAMPUS NETWORK</text>
        <circle cx="60" cy="90" r="16" fill="#701A3D"/><text class="p-mono" x="60" y="94" text-anchor="middle" font-size="10" fill="#fff">UFTB</text>
        <circle cx="180" cy="90" r="16" fill="#3D1223"/><text class="p-mono" x="180" y="94" text-anchor="middle" font-size="10" fill="#fff">PEER</text>
        <circle cx="120" cy="160" r="20" fill="#E11D48"/><text class="p-mono" x="120" y="164" text-anchor="middle" font-size="10" fill="#fff">AI COACH</text>
        <line x1="60" y1="90" x2="120" y2="160" stroke="#C77B9B" stroke-opacity=".4"/>
        <line x1="180" y1="90" x2="120" y2="160" stroke="#C77B9B" stroke-opacity=".4"/>
        <rect x="30" y="198" width="190" height="24" rx="6" fill="#300F1E"/>
        <text class="p-mono" x="125" y="214" text-anchor="middle" font-size="10" fill="#E5B5C7">STUDY ROOMS · SOS SAFE</text>
      </g>

    <rect x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="#C77B9B" stroke-opacity=".2"/>
    <rect class="p-trace-p4" x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="url(#p4-trace)" stroke-width="1.6" stroke-linecap="round"/>
  </g>
</svg>