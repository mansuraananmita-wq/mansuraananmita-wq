<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="1200" height="370" role="img" aria-labelledby="p1-t">
  <title id="p1-t">Folika (ফলিকা): AI-Powered Agricultural Advisory Platform for Bangladeshi Farmers.</title>
  <defs>
    <linearGradient id="p1-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#190B12"/><stop offset="1" stop-color="#10070C"/>
    </linearGradient>
    <radialGradient id="p1-glow" cx="82%" cy="30%" r="55%">
      <stop offset="0" stop-color="#701A3D" stop-opacity=".7"/><stop offset="1" stop-color="#451126" stop-opacity="0"/>
    </radialGradient>
    <pattern id="p1-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#C77B9B" stroke-opacity=".07"/>
    </pattern>
    <clipPath id="p1-clip"><rect width="1200" height="370" rx="18"/></clipPath>
    <linearGradient id="p1-trace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8F0F3"/><stop offset=".45" stop-color="#E5B5C7"/><stop offset="1" stop-color="#C77B9B" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .p-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .p-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .p-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .p-chip { animation: p-chip .7s cubic-bezier(.34,1.56,.64,1) both; }
    @keyframes p-chip { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .p-draw { stroke-dasharray: 600; stroke-dashoffset: 600; animation: p-draw 2s cubic-bezier(.65,0,.35,1) .5s forwards; }
    @keyframes p-draw { to { stroke-dashoffset: 0; } }
    .p-trace-p1 { stroke-dasharray: 564 3136; stroke-dashoffset: 3700; animation: p-trace 7s linear infinite; }
    @keyframes p-trace { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .p-chip { animation: none; } .p-draw { animation: none; stroke-dashoffset: 0; } .p-trace-p1 { display: none; } }
  </style>
  <g clip-path="url(#p1-clip)">
    <rect width="1200" height="370" fill="url(#p1-bg)"/>
    <rect x="720" width="480" height="370" fill="url(#p1-grid)"/>
    <rect width="1200" height="370" fill="url(#p1-glow)"/>

    <g transform="translate(56 46)">
      <text class="p-mono" x="0" y="16" font-size="12" letter-spacing="2.6" fill="#C77B9B">01 · AI · AGRI-TECH · FULL-STACK · 2026</text>
      <text class="p-serif" x="0" y="70" font-size="46" font-weight="300" letter-spacing="-1.2" fill="#F8F0F3">Folika (ফলিকা)</text>
      <text class="p-sans" x="0" y="106" font-size="16.5" fill="#B6A3AC">AI-Powered Agricultural Advisory Platform for Bangladeshi Farmers.</text>
      <text class="p-mono" x="0" y="138" font-size="12.5" fill="#E5B5C7"><tspan fill="#C77B9B">BUILT › </tspan>Bangla-first advisory PWA for crops, fisheries & livestock. Gemini Vision disease diagnosis, Groq Llama 3.1 assistant & 3-tier sync.</text>
      
      <line class="p-draw" x1="0" y1="162" x2="680" y2="162" stroke="#C77B9B" stroke-opacity=".3"/>

      <!-- Metrics -->
      <g transform="translate(0 200)">
        <text class="p-serif" font-size="30" font-weight="300" fill="#F8F0F3">TOP 15</text>
        <text class="p-sans" y="24" font-size="12.5" fill="#B6A3AC">JnU AI & IT Fest Grand Finalist</text>
      </g>
      <g transform="translate(230 200)">
        <text class="p-serif" font-size="30" font-weight="300" fill="#F8F0F3">3-TIER</text>
        <text class="p-sans" y="24" font-size="12.5" fill="#B6A3AC">Offline-first sync engine</text>
      </g>
      <g transform="translate(460 200)">
        <text class="p-serif" font-size="30" font-weight="300" fill="#F8F0F3">VOICE & VISION</text>
        <text class="p-sans" y="24" font-size="12.5" fill="#B6A3AC">Multi-modal Bangla AI assistant</text>
      </g>
    </g>

    <!-- Chips -->
    <g><g class="p-chip" style="animation-delay:1.00s"><rect x="56" y="314" width="92" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="p-mono" x="102" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">React.js</text></g><g class="p-chip" style="animation-delay:1.12s"><rect x="156" y="314" width="110" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="p-mono" x="211" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">TypeScript</text></g><g class="p-chip" style="animation-delay:1.24s"><rect x="274" y="314" width="83" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="p-mono" x="315" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">Node.js</text></g><g class="p-chip" style="animation-delay:1.36s"><rect x="365" y="314" width="137" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="p-mono" x="433" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">Gemini Vision</text></g><g class="p-chip" style="animation-delay:1.48s"><rect x="510" y="314" width="146" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="p-mono" x="583" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">Groq Llama 3.1</text></g><g class="p-chip" style="animation-delay:1.60s"><rect x="664" y="314" width="101" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="p-mono" x="714" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">MySQL 8.0</text></g></g>

    <!-- Right Graphic -->
    <g transform="translate(860 40)">
        <rect x="0" y="0" width="220" height="280" rx="20" fill="#200B17" stroke="#C77B9B" stroke-opacity=".4" stroke-width="1.5"/>
        <rect x="12" y="14" width="196" height="240" rx="12" fill="#14060E"/>
        <circle cx="110" cy="28" r="4" fill="#C77B9B" opacity=".5"/>
        <rect x="26" y="50" width="168" height="60" rx="8" fill="#3B1224" stroke="#E11D48" stroke-opacity=".3"/>
        <text class="p-mono" x="110" y="75" text-anchor="middle" font-size="12" fill="#F8F0F3">AI DIAGNOSIS</text>
        <text class="p-mono" x="110" y="95" text-anchor="middle" font-size="10.5" fill="#E5B5C7">96.4% ACCURACY</text>
        <g fill="#F8F0F3" fill-opacity=".15">
          <rect x="26" y="125" width="168" height="6" rx="3"/><rect x="26" y="145" width="140" height="6" rx="3"/>
          <rect x="26" y="165" width="155" height="6" rx="3"/><rect x="26" y="185" width="110" height="6" rx="3"/>
        </g>
        <rect x="12" y="60" width="196" height="40" fill="#E11D48" fill-opacity=".12">
          <animate attributeName="y" values="30;200;30" dur="4.2s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1; .45 0 .55 1"/>
        </rect>
      </g>

    <rect x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="#C77B9B" stroke-opacity=".2"/>
    <rect class="p-trace-p1" x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="url(#p1-trace)" stroke-width="1.6" stroke-linecap="round"/>
  </g>
</svg>