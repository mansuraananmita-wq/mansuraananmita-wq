<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="ab-t ab-d">
  <title id="ab-t">About Mst. Mansura Anan Mita</title>
  <desc id="ab-d">Full-Stack Developer and AI Architect. B.Sc. in Educational Technology &amp; Engineering at UFTB. Building intelligent systems that can explain themselves.</desc>
  <defs>
    <linearGradient id="ab-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#190B12"/><stop offset="1" stop-color="#10070C"/></linearGradient>
    <radialGradient id="ab-glow" cx="80%" cy="20%" r="70%"><stop offset="0" stop-color="#701A3D" stop-opacity=".6"/><stop offset="1" stop-color="#451126" stop-opacity="0"/></radialGradient>
    <linearGradient id="ab-card-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#240D1A"/><stop offset="1" stop-color="#190B12"/></linearGradient>
  </defs>
  <style>
    .ab-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .ab-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .ab-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .ab-card { animation: ab-in 1s cubic-bezier(.16,1,.3,1) both; }
    .ab-fade { animation: ab-fade 1s ease both; }
    @keyframes ab-in { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: none; } }
    @keyframes ab-fade { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .ab-card, .ab-fade { animation: none; } }
  </style>
  <rect width="1200" height="420" rx="20" fill="url(#ab-bg)"/>
  <rect width="1200" height="420" rx="20" fill="url(#ab-glow)"/>
  <rect x=".5" y=".5" width="1199" height="419" rx="19.5" fill="none" stroke="#C77B9B" stroke-opacity=".16"/>

  <!-- Left: Terminal window -->
  <g transform="translate(36 32)">
    <rect width="660" height="356" rx="12" fill="#14060E" stroke="#C77B9B" stroke-opacity=".28"/>
    <!-- Window controls -->
    <circle cx="24" cy="22" r="5.5" fill="#E11D48"/>
    <circle cx="44" cy="22" r="5.5" fill="#C77B9B" opacity=".6"/>
    <circle cx="64" cy="22" r="5.5" fill="#701A3D"/>
    <text class="ab-mono" x="330" y="26" text-anchor="middle" font-size="11.5" fill="#B6A3AC">mansura.profile.yaml</text>
    <line x1="0" y1="42" x2="660" y2="42" stroke="#C77B9B" stroke-opacity=".15"/>

    <!-- Terminal code content -->
    <g class="ab-mono" font-size="12.5" fill="#B6A3AC">
      <text x="24" y="76"><tspan fill="#C77B9B">name:</tspan> <tspan fill="#F8F0F3">"Mst. Mansura Anan Mita"</tspan></text>
      <text x="24" y="102"><tspan fill="#C77B9B">username:</tspan> <tspan fill="#E5B5C7">"mansuraananmita-wq"</tspan></text>
      <text x="24" y="128"><tspan fill="#C77B9B">role:</tspan> <tspan fill="#F8F0F3">"Full-Stack Developer • AI &amp; System Architect"</tspan></text>
      <text x="24" y="154"><tspan fill="#C77B9B">education:</tspan> <tspan fill="#E5B5C7">"B.Sc. in EdTE, UFTB Bangladesh"</tspan></text>
      <text x="24" y="180"><tspan fill="#C77B9B">focus:</tspan></text>
      <text x="44" y="206"><tspan fill="#E11D48">- </tspan><tspan fill="#F8F0F3">"AI-Driven Platforms (Gemini Vision, Groq Llama 3.1)"</tspan></text>
      <text x="44" y="232"><tspan fill="#E11D48">- </tspan><tspan fill="#F8F0F3">"Scalable Stacks (TypeScript, React, NestJS, Laravel)"</tspan></text>
      <text x="44" y="258"><tspan fill="#E11D48">- </tspan><tspan fill="#F8F0F3">"Campus Tech, Social Commerce &amp; Mobility Ecosystems"</tspan></text>
      <text x="24" y="286"><tspan fill="#C77B9B">philosophy:</tspan> <tspan font-style="italic" fill="#E5B5C7">"Building systems that can explain themselves."</tspan></text>
      <text x="24" y="318" fill="#E11D48">$ <tspan fill="#F8F0F3">ready --for-collaboration</tspan><tspan fill="#E5B5C7">_</tspan></text>
    </g>
  </g>

  <!-- Right: 3 Pillars Cards -->
  <g transform="translate(726 32)">
    <!-- Pillar 1 -->
