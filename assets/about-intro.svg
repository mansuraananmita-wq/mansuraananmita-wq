      <rect width="438" height="106" rx="12" fill="url(#ab-card-bg)" stroke="#C77B9B" stroke-opacity=".24"/>
      <circle cx="28" cy="28" r="4" fill="#E11D48"/>
      <text class="ab-mono" x="42" y="32" font-size="11.5" letter-spacing="1.5" fill="#E5B5C7">ACADEMIC FOUNDATION</text>
      <text class="ab-serif" x="28" y="62" font-size="18" fill="#F8F0F3">EdTE @ Frontier Technology (UFTB)</text>
      <text class="ab-sans" x="28" y="86" font-size="12.5" fill="#B6A3AC">B.Sc. student combining computer engineering with educational tech.</text>
    </g>

    <!-- Pillar 2 -->
    <g class="ab-card" transform="translate(0 124)" style="animation-delay:.35s">
      <rect width="438" height="106" rx="12" fill="url(#ab-card-bg)" stroke="#C77B9B" stroke-opacity=".24"/>
      <circle cx="28" cy="28" r="4" fill="#C77B9B"/>
      <text class="ab-mono" x="42" y="32" font-size="11.5" letter-spacing="1.5" fill="#E5B5C7">ENGINEERING RIGOR</text>
      <text class="ab-serif" x="28" y="62" font-size="18" fill="#F8F0F3">Full-Stack, Mobile &amp; Distributed APIs</text>
      <text class="ab-sans" x="28" y="86" font-size="12.5" fill="#B6A3AC">NestJS, Flutter, React, Laravel, WebSockets, Docker &amp; Relational DBs.</text>
    </g>

    <!-- Pillar 3 -->
    <g class="ab-card" transform="translate(0 248)" style="animation-delay:.55s">
      <rect width="438" height="106" rx="12" fill="url(#ab-card-bg)" stroke="#C77B9B" stroke-opacity=".24"/>
      <circle cx="28" cy="28" r="4" fill="#701A3D"/>
      <text class="ab-mono" x="42" y="32" font-size="11.5" letter-spacing="1.5" fill="#E5B5C7">AI &amp; INTELLIGENT SYSTEMS</text>
      <text class="ab-serif" x="28" y="62" font-size="18" fill="#F8F0F3">Multi-Modal Vision, Voice &amp; LLMs</text>
      <text class="ab-sans" x="28" y="86" font-size="12.5" fill="#B6A3AC">Gemini Vision diagnosis, Groq Llama 3.1 Bangla voice &amp; offline sync.</text>
    </g>
